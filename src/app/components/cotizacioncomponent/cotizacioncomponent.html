<div class="card p-3" *ngIf="alojamiento">
  <h4>${{alojamiento.precioNoche}} / noche</h4>

  <label class="form-label mt-2">Fecha de llegada</label>
  <input type="date" class="form-control" [(ngModel)]="fechaLlegada" (input)="reiniciarCotizacion()">

  <label class="form-label mt-2">Fecha de salida</label>
  <input type="date" class="form-control" [(ngModel)]="fechaSalida" (input)="reiniciarCotizacion()">

  <label class="form-label mt-2">Huéspedes</label>
  <input type="number" class="form-control" [(ngModel)]="huespedes" (input)="reiniciarCotizacion()" min="1">

  <button class="btn btn-primary mt-3" (click)="cotizar()">Cotizar</button>

  <div class="alert alert-danger mt-3" *ngIf="mensajeError">{{mensajeError}}</div>

  <div *ngIf="cotizacionValida" class="mt-3">
    <p>Noches: {{noches}}</p>
    <p>Subtotal: ${{subtotal}}</p>
    <p>Tarifa de limpieza: ${{alojamiento.tarifaLimpieza}}</p>
    <p>Tarifa de servicio: ${{tarifaServicio}}</p>
    <p class="fw-bold">Total: ${{total}}</p>
    <button class="btn btn-success w-100" (click)="irAReservar()">Reservar</button>
  </div>
</div>

<div class="card mb-4 p-3">
  <div class="row g-3">
    <div class="col-md-3">
      <label class="form-label">Ciudad</label>
      <select class="form-select" [(ngModel)]="ciudad" (change)="cambio()">
        <option value="">Todas</option>
        <option *ngFor="let c of ciudades" [value]="c">{{c}}</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Huéspedes</label>
      <input type="number" class="form-control" [(ngModel)]="huespedes" (input)="cambio()" min="1">
    </div>
    <div class="col-md-3">
      <label class="form-label">Tipo</label>
      <select class="form-select" [(ngModel)]="tipo" (change)="cambio()">
        <option value="">Todos</option>
        <option *ngFor="let t of tipos" [value]="t">{{t}}</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Precio máximo</label>
      <input type="number" class="form-control" [(ngModel)]="precioMax" (input)="cambio()" min="0">
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-outline-secondary" (click)="limpiar()">Limpiar filtros</button>
  </div>
</div>
